[theme]
base = "dark"
primaryColor = "#D97757"
backgroundColor = "#262624"
secondaryBackgroundColor = "#30302E"
textColor = "#F5F4EF"
font = "sans serif"

[server]
headless = true

# Streamlit's source watcher walks every imported module looking for __path__.
# transformers resolves attributes lazily, so that walk imports its vision
# model code, which needs torchvision — a dependency this project has no other
# use for. The result was ~100 harmless tracebacks on every page load. Turning
# the watcher off silences them; the cost is that edits to app.py no longer
# reload automatically, so restart the server (or press R in the browser) after
# changing the code.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
